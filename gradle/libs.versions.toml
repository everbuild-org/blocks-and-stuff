[versions]
minestom = "26_3-SNAPSHOT"
twaddle = "0.1.0"

kotlin-version = "2.3.10"
tinylog = "2.8.1"
slf4j = "2.0.20"
junit = "6.1.3"
mockito = "5.24.0"
mockito-kotlin = "6.4.0"
fastutil = "8.5.19"
jetbrains-annotations = "26.1.0"
kotlinx-serialization = "1.9.0"

[libraries]
minestom = { group = "net.minestom", name = "minestom", version.ref = "minestom" }
twaddle-common-blocks = { module = "org.everbuild.twaddle:twaddle-common-block", version.ref = "twaddle"}
twaddle-stackedBehaviour = { module = "org.everbuild.twaddle:twaddle-stacked-block-behaviour", version.ref = "twaddle"}

slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
tinylog-api = { group = "org.tinylog", name = "tinylog-api", version.ref = "tinylog" }
tinylog-impl = { group = "org.tinylog", name = "tinylog-impl", version.ref = "tinylog" }
tinylog-slf4j = { group = "org.tinylog", name = "slf4j-tinylog", version.ref = "tinylog" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-version" }
